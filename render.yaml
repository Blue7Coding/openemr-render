services:
  # 1. The Persistent Database Layer
  - type: pserv
    name: openemr-db
    runtime: image
    image: mariadb:10.11
    plan: starter # Requires paid plan for persistent disks
    disk:
      name: db-volume
      mountPath: /var/lib/mysql
      sizeGB: 10
    envVars:
      - key: MYSQL_ROOT_PASSWORD
        generateValue: true # Generates a secure, random root password
      - key: MYSQL_DATABASE
        value: openemr
      - key: MYSQL_USER
        value: openemr_user
      - key: MYSQL_PASSWORD
        generateValue: true

  # 2. The OpenEMR Application Layer
  - type: web
    name: openemr-app
    runtime: image
    image: openemr/openemr:7.0.2 # Use an official stable release tag
    plan: starter # 2GB RAM required for setup compilation schema
    disk:
      name: openemr-sites
      mountPath: /var/www/localhost/htdocs/openemr/sites
      sizeGB: 20
    envVars:
      # Link to the Private DB service above
      - key: MYSQL_HOST
        value: openemr-db
      - key: MYSQL_ROOT_PASS
        fromService:
          type: pserv
          name: openemr-db
          envVar: MYSQL_ROOT_PASSWORD
      - key: MYSQL_USER
        fromService:
          type: pserv
          name: openemr-db
          envVar: MYSQL_USER
      - key: MYSQL_PASS
        fromService:
          type: pserv
          name: openemr-db
          envVar: MYSQL_PASSWORD
      - key: MYSQL_DATABASE
        fromService:
          type: pserv
          name: openemr-db
          envVar: MYSQL_DATABASE
      
      # Administrative Login Overrides
      - key: OE_USER
        value: admin
      - key: OE_PASS
        value: ChangeThisSecurePassword123! # Change this immediately!
        
      # Optional: Enable Let's Encrypt automated SSL renewals if using a custom domain
      - key: DOMAIN
        value: your-emr-domain.com 
